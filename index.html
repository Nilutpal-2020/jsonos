<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Primary meta -->
    <title>JSON OS — Online JSON viewer, editor, validator, formatter, diff &amp; repair</title>
    <meta name="description" content="JSON OS is a free, local-first online JSON workbench. View, edit, validate (JSON Schema), format, repair, query, transform, and compare JSON in your browser. Tree, text, and table views with a multi-column workspace. No upload, no signup, runs entirely offline." />
    <meta name="keywords" content="json editor, json viewer, json formatter, json validator, json schema, json beautifier, json minifier, json repair, json compare, json diff, online json tool, json transform, json table editor, json tree viewer, json to csv, json csv export, free json editor, browser json editor, offline json tool" />
    <meta name="author" content="JSON OS" />
    <meta name="application-name" content="JSON OS" />
    <meta name="generator" content="Vite + Svelte" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <meta name="theme-color" content="#131720" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="%VITE_PUBLIC_URL%/" />

    <!-- Icons / manifest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32"   href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#5b9eff" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JSON OS" />
    <meta property="og:title" content="JSON OS — Online JSON workbench (viewer, editor, validator, diff)" />
    <meta property="og:description" content="View, edit, validate, repair, query, transform, and compare JSON locally in your browser. Tree · text · table views, multi-column workspace, JSON Schema validation, side-by-side diff. Free and local-first." />
    <meta property="og:url" content="%VITE_PUBLIC_URL%/" />
    <meta property="og:image" content="%VITE_PUBLIC_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JSON OS — JSON workbench with tree, text, and table views" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JSON OS — Online JSON workbench" />
    <meta name="twitter:description" content="View, edit, validate, repair, and compare JSON locally in your browser. Free, no signup, no uploads." />
    <meta name="twitter:image" content="%VITE_PUBLIC_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="JSON OS — JSON workbench" />

    <!-- Performance hints -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Prevent FOUC + set the page background to match the theme before JS runs -->
    <style>
      html { background: #0c0f14; color-scheme: dark light; }
      @media (prefers-color-scheme: light) { html { background: #f5f7fa; } }
      html[data-theme="dark"]  { background: #0c0f14; }
      html[data-theme="light"] { background: #f5f7fa; }
      body { margin: 0; }
      #app { min-height: 100vh; }
    </style>

    <!-- Structured data: SoftwareApplication -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "@id": "%VITE_PUBLIC_URL%/#software",
        "name": "JSON OS",
        "alternateName": "jsonos",
        "applicationCategory": "DeveloperApplication",
        "applicationSubCategory": "JSONEditor",
        "operatingSystem": "Web",
        "browserRequirements": "Requires modern browser with ES2022 support",
        "description": "Browser-based JSON workbench for viewing, editing, validating, repairing, querying, transforming, diffing, and sharing JSON. Tree, text, and table views with multi-column workspace and local-first processing.",
        "url": "%VITE_PUBLIC_URL%/",
        "image": {
          "@type": "ImageObject",
          "url": "%VITE_PUBLIC_URL%/og-image.png",
          "width": 1200,
          "height": 630
        },
        "softwareVersion": "1.0",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "publisher": { "@id": "%VITE_PUBLIC_URL%/#org" },
        "creator":   { "@id": "%VITE_PUBLIC_URL%/#org" },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "availability": "https://schema.org/InStock"
        },
        "featureList": [
          "JSON viewer and editor",
          "Tree, text, and table views",
          "Multi-column workspace (up to 3)",
          "JSON Schema validation (Ajv)",
          "Format, minify, sort keys",
          "Auto-repair: comments, smart quotes, trailing commas, unquoted keys, hex/oct/bin numbers, Python literals, unclosed brackets, missing commas",
          "Side-by-side compare with ignore rules and move detection",
          "CSV export",
          "Light, dark, and system themes",
          "Local-first: parsing in a Web Worker, persistence in IndexedDB"
        ],
        "aggregateRating": {
          "@type": "AggregateRating",
          "ratingValue": "5",
          "ratingCount": "1",
          "bestRating": "5",
          "worstRating": "1"
        }
      }
    </script>

    <!-- Structured data: Organization (logo source for Knowledge Panel) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "%VITE_PUBLIC_URL%/#org",
        "name": "JSON OS",
        "url": "%VITE_PUBLIC_URL%/",
        "logo": {
          "@type": "ImageObject",
          "url": "%VITE_PUBLIC_URL%/favicon-512.png",
          "width": 512,
          "height": 512,
          "caption": "JSON OS logo"
        },
        "image": "%VITE_PUBLIC_URL%/favicon-512.png",
        "email": "jsonos.online@gmail.com",
        "sameAs": []
      }
    </script>

    <!-- Structured data: WebSite (sitelinks search box potential) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "%VITE_PUBLIC_URL%/#website",
        "name": "JSON OS",
        "url": "%VITE_PUBLIC_URL%/",
        "inLanguage": "en",
        "publisher": { "@id": "%VITE_PUBLIC_URL%/#org" }
      }
    </script>

    <!-- Structured data: FAQPage (rich result eligible) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Is JSON OS free to use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. JSON OS is free, requires no account, and works entirely in your browser."
            }
          },
          {
            "@type": "Question",
            "name": "Is my JSON data uploaded to a server?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. All parsing, validation, formatting, and storage happen locally in your browser. Documents persist in your browser's IndexedDB and never leave your device unless you explicitly export them."
            }
          },
          {
            "@type": "Question",
            "name": "What can the Repair feature fix?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Repair handles comments (// /* */ #), smart quotes, single-quoted strings, unquoted object keys, trailing commas, missing commas, hex/octal/binary numbers, Python literals (True, False, None), undefined and NaN, unclosed brackets, and stray top-level values. After running, a banner lists each fix that was applied."
            }
          },
          {
            "@type": "Question",
            "name": "Can I compare two JSON documents side by side?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Click the ⇄ Compare button or press Cmd+Shift+C. Pick a peer document, choose tree or text view, and the workspace switches to two linked columns with synced scroll and color-coded differences (added, removed, changed, moved). Ignore rules let you skip specific paths, treat null as missing, ignore string case, or trim whitespace."
            }
          },
          {
            "@type": "Question",
            "name": "Can I validate JSON against a schema?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. Open the side panel, pick the Schema tab, and paste a JSON Schema. The active document is continuously validated using Ajv with formats. Errors appear inline with their instance paths."
            }
          },
          {
            "@type": "Question",
            "name": "Does it work offline?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "After the first load, the app and your saved documents work without a network. JSON parsing runs in a Web Worker; everything is stored in IndexedDB on your device."
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app">
      <noscript>
        <div style="padding:24px;font:14px/1.5 system-ui,sans-serif;max-width:560px;margin:48px auto;color:#e8ecf2">
          <h1 style="margin:0 0 8px">JSON OS</h1>
          <p>This app needs JavaScript. Enable it to view, edit, and validate JSON in your browser.</p>
          <p>Read more: <a href="/privacy.html">Privacy Policy</a> · <a href="/terms.html">Terms of Service</a>.</p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
