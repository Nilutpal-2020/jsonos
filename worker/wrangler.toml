name = "jsonos-share"
main = "src/index.ts"
compatibility_date = "2025-01-15"

# Run `wrangler kv namespace create SHARES` and paste the id below.
# For local `wrangler dev`, also create a preview namespace and set preview_id.
[[kv_namespaces]]
binding = "SHARES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
preview_id = "REPLACE_WITH_PREVIEW_KV_NAMESPACE_ID"

[vars]
# Comma-separated allowed origins for CORS. Use "*" to allow any origin (dev only).
ALLOWED_ORIGINS = "http://localhost:5173"
# Max payload size in bytes (default 1 MiB).
MAX_BYTES = "1048576"
# Default TTL in days (0 = no expiry).
DEFAULT_TTL_DAYS = "30"
